<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating Hexagon — Multiple Balls</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #0a0a1a;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
}
canvas {
display: block;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- Sizing ---
function resize() {
const size = Math.min(window.innerWidth, window.innerHeight) * 0.9;
canvas.width = size;
canvas.height = size;
}
resize();
window.addEventListener('resize', resize);

// --- Physics constants ---
const HEX_RADIUS_RATIO = 0.38;
const BALL_RADIUS_RATIO = 0.025;
const GRAVITY = 980;
const ANGULAR_VEL = 1.4;
const SUB_STEPS = 10;
const BALL_COLORS = [
'#ff4757', '#2ed573', '#1e90ff', '#ffa502',
'#ff6b81', '#7bed9f', '#70a1ff', '#ffda79',
'#eccc68', '#a4b0be', '#ff7979', '#badc58'
];

// --- State ---
let hexRotation = 0;
let balls = [];
const NUM_BALLS = 6;

// --- Helpers ---
function hexRadius() { return canvas.width * HEX_RADIUS_RATIO; }
function ballRadius() { return canvas.width * BALL_RADIUS_RATIO; }

function getHexVertices(cx, cy, radius, angle) {
const verts = [];
for (let i = 0; i < 6; i++) {
const a = angle + (i * Math.PI) / 3;
verts.push({
x: cx + radius * Math.cos(a),
y: cy + radius * Math.sin(a)
});
}
return verts;
}

function edgeNormal(x0, y0, x1, y1) {
const dx = x1 - x0;
const dy = y1 - y0;
const len = Math.sqrt(dx * dx + dy * dy);
return { x: dy / len, y: -dx / len };
}

function pointToSegmentDist(px, py, x0, y0, x1, y1) {
const dx = x1 - x0;
const dy = y1 - y0;
const lenSq = dx * dx + dy * dy;
let t = ((px - x0) * dx + (py - y0) * dy) / lenSq;
t = Math.max(0, Math.min(1, t));
const closestX = x0 + t * dx;
const closestY = y0 + t * dy;
return {
dist: Math.sqrt((px - closestX) ** 2 + (py - closestY) ** 2),
closestX,
closestY,
t
};
}

function wallVelocity(px, py, cx, cy, omega) {
return {
vx: -omega * (py - cy),
vy: omega * (px - cx)
};
}

// Ball-to-ball elastic collision
function ballBallCollision(b1, b2, br) {
const dx = b2.x - b1.x;
const dy = b2.y - b1.y;
const dist = Math.sqrt(dx * dx + dy * dy);
const minDist = br * 2;

if (dist < minDist && dist > 0.001) {
const nx = dx / dist;
const ny = dy / dist;

// Separate overlapping balls
const overlap = minDist - dist;
b1.x -= nx * overlap * 0.5;
b1.y -= ny * overlap * 0.5;
b2.x += nx * overlap * 0.5;
b2.y += ny * overlap * 0.5;

// Elastic collision (equal mass)
const dvx = b1.vx - b2.vx;
const dvy = b1.vy - b2.vy;
const dvDotN = dvx * nx + dvy * ny;

if (dvDotN > 0) {
b1.vx -= dvDotN * nx;
b1.vy -= dvDotN * ny;
b2.vx += dvDotN * nx;
b2.vy += dvDotN * ny;
}
}
}

// --- Physics step ---
function physicsStep(dt) {
const W = canvas.width;
const H = canvas.height;
const cx = W / 2;
const cy = H / 2;
const r = hexRadius();
const br = ballRadius();

const verts = getHexVertices(cx, cy, r, hexRotation);

// Integrate gravity for all balls
for (const ball of balls) {
ball.vy += GRAVITY * dt;
ball.x += ball.vx * dt;
ball.y += ball.vy * dt;
}

// Ball-to-ball collisions
for (let i = 0; i < balls.length; i++) {
for (let j = i + 1; j < balls.length; j++) {
ballBallCollision(balls[i], balls[j], br);
}
}

// Hexagon wall collisions for all balls
for (const ball of balls) {
for (let i = 0; i < 6; i++) {
const p0 = verts[i];
const p1 = verts[(i + 1) % 6];

const result = pointToSegmentDist(ball.x, ball.y, p0.x, p0.y, p1.x, p1.y);

if (result.dist < br) {
const n = edgeNormal(p0.x, p0.y, p1.x, p1.y);

const toCenterX = cx - result.closestX;
const toCenterY = cy - result.closestY;
if (n.x * toCenterX + n.y * toCenterY < 0) {
n.x = -n.x;
n.y = -n.y;
}

const wv = wallVelocity(result.closestX, result.closestY, cx, cy, ANGULAR_VEL);

const relVx = ball.vx - wv.vx;
const relVy = ball.vy - wv.vy;
const vn = relVx * n.x + relVy * n.y;

if (vn < 0) {
const relVnX = relVx - 2 * vn * n.x;
const relVnY = relVy - 2 * vn * n.y;

ball.vx = relVnX + wv.vx;
ball.vy = relVnY + wv.vy;
}

const penetration = br - result.dist;
ball.x += n.x * (penetration + 0.5);
ball.y += n.y * (penetration + 0.5);
}
}
}

hexRotation += ANGULAR_VEL * dt;
}

// --- Drawing ---
function draw() {
const W = canvas.width;
const H = canvas.height;
const cx = W / 2;
const cy = H / 2;

ctx.fillStyle = '#0a0a1a';
ctx.fillRect(0, 0, W, H);

// Draw trails for each ball
for (let bi = 0; bi < balls.length; bi++) {
const ball = balls[bi];
const trail = ball.trail;

if (trail.length > 1) {
for (let i = 1; i < trail.length; i++) {
const alpha = (i / trail.length) * 0.5;
const hue = (i / trail.length) * 40 + parseInt(ball.color.substr(1, 2), 16) % 360;
ctx.beginPath();
ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
ctx.lineTo(trail[i].x, trail[i].y);
ctx.strokeStyle = hexWithAlpha(ball.color, alpha);
ctx.lineWidth = 2;
ctx.stroke();
}
}
}

// Draw hexagon
const verts = getHexVertices(cx, cy, hexRadius(), hexRotation);

ctx.shadowColor = '#00bfff';
ctx.shadowBlur = 20;

ctx.beginPath();
ctx.moveTo(verts[0].x, verts[0].y);
for (let i = 1; i < 6; i++) {
ctx.lineTo(verts[i].x, verts[i].y);
}
ctx.closePath();

ctx.strokeStyle = '#00bfff';
ctx.lineWidth = 3;
ctx.stroke();

ctx.shadowBlur = 0;
ctx.beginPath();
ctx.moveTo(verts[0].x, verts[0].y);
for (let i = 1; i < 6; i++) {
ctx.lineTo(verts[i].x, verts[i].y);
}
ctx.closePath();
ctx.strokeStyle = 'rgba(0, 191, 255, 0.3)';
ctx.lineWidth = 8;
ctx.stroke();

// Draw each ball
for (const ball of balls) {
const speed = Math.sqrt(ball.vx ** 2 + ball.vy ** 2);
ctx.shadowColor = ball.color;
ctx.shadowBlur = 12;

ctx.beginPath();
ctx.arc(ball.x, ball.y, ballRadius(), 0, Math.PI * 2);
ctx.fillStyle = ball.color;
ctx.fill();

ctx.shadowBlur = 0;

// Highlight
const grad = ctx.createRadialGradient(
ball.x - ballRadius() * 0.3, ball.y - ballRadius() * 0.3, 0,
ball.x, ball.y, ballRadius()
);
grad.addColorStop(0, 'rgba(255, 255, 255, 0.45)');
grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
ctx.beginPath();
ctx.arc(ball.x, ball.y, ballRadius(), 0, Math.PI * 2);
ctx.fillStyle = grad;
ctx.fill();
}
}

function hexWithAlpha(hex, alpha) {
const r = parseInt(hex.substr(1, 2), 16);
const g = parseInt(hex.substr(3, 2), 16);
const b = parseInt(hex.substr(5, 2), 16);
return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// --- Init ---
function init() {
const W = canvas.width;
const H = canvas.height;
const cx = W / 2;
const cy = H / 2;
const r = hexRadius();
const br = ballRadius();

balls = [];

// Distribute balls in a small cluster near the center-top area
for (let i = 0; i < NUM_BALLS; i++) {
const angle = (i / NUM_BALLS) * Math.PI * 2;
const spread = br * 3;
balls.push({
x: cx + Math.cos(angle) * spread,
y: cy - r * 0.5 + Math.sin(angle) * spread,
vx: (Math.random() - 0.5) * 80,
vy: Math.random() * 20,
color: BALL_COLORS[i % BALL_COLORS.length],
trail: [],
trailLength: 40
});
}
}

// --- Main loop ---
let lastTime = 0;

function loop(timestamp) {
if (!lastTime) lastTime = timestamp;
let frameDt = (timestamp - lastTime) / 1000;
lastTime = timestamp;

frameDt = Math.min(frameDt, 1 / 30);

const subDt = frameDt / SUB_STEPS;
for (let i = 0; i < SUB_STEPS; i++) {
physicsStep(subDt);
}

// Update trails
for (const ball of balls) {
ball.trail.push({ x: ball.x, y: ball.y });
if (ball.trail.length > ball.trailLength) {
ball.trail.shift();
}
}

draw();
requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
